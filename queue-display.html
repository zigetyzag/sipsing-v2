<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sipsing Karaoke Queue</title>
  <link rel="stylesheet" href="queue-display.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="queue-display" class="container-fluid">
    <header class="text-center py-3 mb-4">
      <h1 class="display-4">Karaoke Queue</h1>
      <h3 id="venue-name" class="mb-0">Loading...</h3>
    </header>

    <div class="row">
      <div class="col-lg-8 mx-auto">
        <div class="card shadow-lg mb-5">
          <div class="card-header bg-primary text-white">
            <div class="d-flex justify-content-between align-items-center">
              <h3 class="mb-0">Current Queue</h3>
              <div class="text-end">
                <span id="refresh-time"></span>
                <span id="refresh-indicator" class="ms-2"><i class="fas fa-sync-alt fa-spin"></i></span>
              </div>
            </div>
          </div>
          
          <div class="card-body p-0">
            <div id="current-performer" class="bg-light p-3 border-bottom">
              <h4 class="text-center">Now Performing</h4>
              <div id="now-singing" class="d-flex align-items-center justify-content-center p-3">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </div>
            
            <div id="bidding-info" class="p-3 bg-info bg-opacity-25 text-center">
              <h5><i class="fas fa-star text-warning"></i> Song Boosting System <i class="fas fa-star text-warning"></i></h5>
              <p class="mb-1">Want to sing sooner? Place a bid to boost your position!</p>
              <p class="mb-0"><strong>Minimum bid: $5</strong> • Increase by $5 increments • See DJ to place bid</p>
            </div>
            
            <table class="table table-hover table-striped mb-0">
              <thead>
                <tr>
                  <th scope="col" class="text-center">#</th>
                  <th scope="col">Performer</th>
                  <th scope="col">Song</th>
                  <th scope="col" class="text-center">Table</th>
                  <th scope="col" class="text-end">Bid</th>
                </tr>
              </thead>
              <tbody id="queue-list">
                <tr>
                  <td class="text-center" colspan="5">Loading queue...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Bid animation overlay -->
    <div id="bid-animation" class="position-fixed top-0 start-0 w-100 h-100 d-none">
      <div class="bid-notification text-center">
        <div class="bid-amount">$<span id="bid-amount-value">25</span></div>
        <div class="bid-message">New bid placed!</div>
        <div class="table-info">Table <span id="bid-table-number">12</span> moved up!</div>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap and dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Firebase -->
  <script type="module" src="../firebase.js"></script>
  
  <!-- Queue display JavaScript -->
  <script type="module" src="queue-display.js"></script>
</body>
</html>
